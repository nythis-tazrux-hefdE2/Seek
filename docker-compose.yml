x-api-worker-env:
  HOST_IP: ${HOST_IP:-}
  RUNNING_IN_DOCKER: 'true'
  SEEK_ENV: development
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env, or rerun `bash scripts/init.sh`.}
  SEEK_INSTANCE_ID: ${SEEK_INSTANCE_ID:?Set SEEK_INSTANCE_ID in .env, or rerun `bash
    scripts/init.sh`.}
  API_KEY_DERIVATION_SECRET: ${API_KEY_DERIVATION_SECRET:?Set API_KEY_DERIVATION_SECRET
    in .env [v0.7.2+], or rerun `bash scripts/init.sh`.}
  RAPIDOCR_MODEL_DIR: /home/seek/.cache/rapidocr/models
  POSTGRES_URL: ${POSTGRES_URL:-postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-seek}}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  MINIO_URI: ${MINIO_URI:-http://minio:9000}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
  MINERU_API_URI: ${MINERU_API_URI:-http://mineru-api:30001}
  PADDLEX_URI: ${PADDLEX_URI:-http://paddlex:8080}
  SANDBOX_RUNNER_URL: ${SANDBOX_RUNNER_URL:-http://sandbox-runner:8090}
  SANDBOX_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN:-}
  SANDBOX_IDLE_SECONDS: ${SANDBOX_IDLE_SECONDS:-300}
  SANDBOX_EXEC_TIMEOUT_SECONDS: ${SANDBOX_EXEC_TIMEOUT_SECONDS:-180}
  SANDBOX_MAX_OUTPUT_BYTES: ${SANDBOX_MAX_OUTPUT_BYTES:-262144}
  RUN_CANCEL_KEY_TTL_SECONDS: ${RUN_CANCEL_KEY_TTL_SECONDS:-1800}
  RUN_EVENTS_STREAM_TTL_SECONDS: ${RUN_EVENTS_STREAM_TTL_SECONDS:-7200}
  READINESS_PROBE_TIMEOUT_SECONDS: ${READINESS_PROBE_TIMEOUT_SECONDS:-2}
  READINESS_CACHE_TTL_SECONDS: ${READINESS_CACHE_TTL_SECONDS:-1}
  SEEK_CORS_ORIGINS: ${SEEK_CORS_ORIGINS:-}
  SEEK_SKILL_DATA_DIR: /app/skill-sources
  SEEK_SKILL_PROJECTION_DIR: /app/skill-projections
  NO_PROXY: localhost,127.0.0.1,postgres,redis,minio,sandbox-runner
  no_proxy: localhost,127.0.0.1,postgres,redis,minio,sandbox-runner
x-logging:
  driver: json-file
  options: &id001
    max-size: 50m
    max-file: '3'
services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-seek}-api:${SEEK_VERSION:-0.8.0.beta4}
    working_dir: /app
    user: 1000:1000
    volumes:
    - ./backend/seek:/app/seek
    - type: bind
      source: ${SEEK_STATE_DIR:-./docker/volumes}/seek/threads
      target: /app/user-data
    - type: bind
      source: ${SEEK_STATE_DIR:-./docker/volumes}/seek/skill-sources
      target: /app/skill-sources
    - type: bind
      source: ${SEEK_STATE_DIR:-./docker/volumes}/seek/skill-projections
      target: /app/skill-projections
    ports:
    - ${SEEK_API_PORT:-35050}:5050
    networks:
    - app-network
    extra_hosts:
    - host.docker.internal:host-gateway
    env_file:
    - ${SEEK_ENV_FILE:-.env}
    environment:
      HOST_IP: ${HOST_IP:-}
      RUNNING_IN_DOCKER: 'true'
      SEEK_ENV: development
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env, or rerun `bash
        scripts/init.sh`.}
      SEEK_INSTANCE_ID: ${SEEK_INSTANCE_ID:?Set SEEK_INSTANCE_ID in .env, or rerun
        `bash scripts/init.sh`.}
      API_KEY_DERIVATION_SECRET: ${API_KEY_DERIVATION_SECRET:?Set API_KEY_DERIVATION_SECRET
        in .env [v0.7.2+], or rerun `bash scripts/init.sh`.}
      RAPIDOCR_MODEL_DIR: /home/seek/.cache/rapidocr/models
      POSTGRES_URL: ${POSTGRES_URL:-postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-seek}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MINIO_URI: ${MINIO_URI:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINERU_API_URI: ${MINERU_API_URI:-http://mineru-api:30001}
      PADDLEX_URI: ${PADDLEX_URI:-http://paddlex:8080}
      SANDBOX_RUNNER_URL: ${SANDBOX_RUNNER_URL:-http://sandbox-runner:8090}
      SANDBOX_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN:-}
      SANDBOX_IDLE_SECONDS: ${SANDBOX_IDLE_SECONDS:-300}
      SANDBOX_EXEC_TIMEOUT_SECONDS: ${SANDBOX_EXEC_TIMEOUT_SECONDS:-180}
      SANDBOX_MAX_OUTPUT_BYTES: ${SANDBOX_MAX_OUTPUT_BYTES:-262144}
      RUN_CANCEL_KEY_TTL_SECONDS: ${RUN_CANCEL_KEY_TTL_SECONDS:-1800}
      RUN_EVENTS_STREAM_TTL_SECONDS: ${RUN_EVENTS_STREAM_TTL_SECONDS:-7200}
      READINESS_PROBE_TIMEOUT_SECONDS: ${READINESS_PROBE_TIMEOUT_SECONDS:-2}
      READINESS_CACHE_TTL_SECONDS: ${READINESS_CACHE_TTL_SECONDS:-1}
      SEEK_CORS_ORIGINS: ${SEEK_CORS_ORIGINS:-}
      SEEK_SKILL_DATA_DIR: /app/skill-sources
      SEEK_SKILL_PROJECTION_DIR: /app/skill-projections
      NO_PROXY: localhost,127.0.0.1,postgres,redis,minio,sandbox-runner
      no_proxy: localhost,127.0.0.1,postgres,redis,minio,sandbox-runner
      SEEK_RUNTIME_DIR: /app/runtime/api
      SEEK_USER_DATA_DIR: /app/user-data
      POSTGRES_POOL_SIZE: ${API_POSTGRES_POOL_SIZE:-120}
      POSTGRES_MAX_OVERFLOW: ${API_POSTGRES_MAX_OVERFLOW:-40}
      POSTGRES_POOL_TIMEOUT_SECONDS: ${API_POSTGRES_POOL_TIMEOUT_SECONDS:-30}
      LANGGRAPH_POSTGRES_POOL_SIZE: ${API_LANGGRAPH_POSTGRES_POOL_SIZE:-10}
      LANGGRAPH_POSTGRES_POOL_TIMEOUT_SECONDS: ${API_LANGGRAPH_POSTGRES_POOL_TIMEOUT_SECONDS:-30}
      REDIS_MAX_CONNECTIONS: ${API_REDIS_MAX_CONNECTIONS:-256}
    command: uv run --no-sync --no-dev uvicorn seek.api.main:app --no-access-log --host
      0.0.0.0 --port 5050 --timeout-graceful-shutdown 5
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://localhost:5050/api/system/ready || exit 1
      interval: 30s
      timeout: 15s
      retries: 8
      start_period: 180s
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      app-init:
        condition: service_completed_successfully
      sandbox-runner:
        condition: service_healthy
    logging:
      driver: json-file
      options: *id001
  worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-seek}-api:${SEEK_VERSION:-0.8.0.beta4}
    working_dir: /app
    user: 1000:1000
    volumes:
    - ./backend/seek:/app/seek
    - type: bind
      source: ${SEEK_STATE_DIR:-./docker/volumes}/seek/threads
      target: /app/user-data
    - type: bind
      source: ${SEEK_STATE_DIR:-./docker/volumes}/seek/skill-sources
      target: /app/skill-sources
    - type: bind
      source: ${SEEK_STATE_DIR:-./docker/volumes}/seek/skill-projections
      target: /app/skill-projections
    - ./backend/pyproject.toml:/app/pyproject.toml
    - ./backend/uv.lock:/app/uv.lock
    networks:
    - app-network
    extra_hosts:
    - host.docker.internal:host-gateway
    env_file:
    - ${SEEK_ENV_FILE:-.env}
    environment:
      HOST_IP: ${HOST_IP:-}
      RUNNING_IN_DOCKER: 'true'
      SEEK_ENV: development
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env, or rerun `bash
        scripts/init.sh`.}
      SEEK_INSTANCE_ID: ${SEEK_INSTANCE_ID:?Set SEEK_INSTANCE_ID in .env, or rerun
        `bash scripts/init.sh`.}
      API_KEY_DERIVATION_SECRET: ${API_KEY_DERIVATION_SECRET:?Set API_KEY_DERIVATION_SECRET
        in .env [v0.7.2+], or rerun `bash scripts/init.sh`.}
      RAPIDOCR_MODEL_DIR: /home/seek/.cache/rapidocr/models
      POSTGRES_URL: ${POSTGRES_URL:-postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-seek}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MINIO_URI: ${MINIO_URI:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINERU_API_URI: ${MINERU_API_URI:-http://mineru-api:30001}
      PADDLEX_URI: ${PADDLEX_URI:-http://paddlex:8080}
      SANDBOX_RUNNER_URL: ${SANDBOX_RUNNER_URL:-http://sandbox-runner:8090}
      SANDBOX_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN:-}
      SANDBOX_IDLE_SECONDS: ${SANDBOX_IDLE_SECONDS:-300}
      SANDBOX_EXEC_TIMEOUT_SECONDS: ${SANDBOX_EXEC_TIMEOUT_SECONDS:-180}
      SANDBOX_MAX_OUTPUT_BYTES: ${SANDBOX_MAX_OUTPUT_BYTES:-262144}
      RUN_CANCEL_KEY_TTL_SECONDS: ${RUN_CANCEL_KEY_TTL_SECONDS:-1800}
      RUN_EVENTS_STREAM_TTL_SECONDS: ${RUN_EVENTS_STREAM_TTL_SECONDS:-7200}
      READINESS_PROBE_TIMEOUT_SECONDS: ${READINESS_PROBE_TIMEOUT_SECONDS:-2}
      READINESS_CACHE_TTL_SECONDS: ${READINESS_CACHE_TTL_SECONDS:-1}
      SEEK_CORS_ORIGINS: ${SEEK_CORS_ORIGINS:-}
      SEEK_SKILL_DATA_DIR: /app/skill-sources
      SEEK_SKILL_PROJECTION_DIR: /app/skill-projections
      NO_PROXY: localhost,127.0.0.1,postgres,redis,minio,sandbox-runner
      no_proxy: localhost,127.0.0.1,postgres,redis,minio,sandbox-runner
      SEEK_RUNTIME_DIR: /app/runtime/worker
      SEEK_USER_DATA_DIR: /app/user-data
      ARQ_MAX_JOBS: ${ARQ_MAX_JOBS:-140}
      REDIS_MAX_CONNECTIONS: ${WORKER_REDIS_MAX_CONNECTIONS:-256}
      POSTGRES_POOL_SIZE: ${WORKER_POSTGRES_POOL_SIZE:-120}
      POSTGRES_MAX_OVERFLOW: ${WORKER_POSTGRES_MAX_OVERFLOW:-40}
      POSTGRES_POOL_TIMEOUT_SECONDS: ${WORKER_POSTGRES_POOL_TIMEOUT_SECONDS:-30}
      LANGGRAPH_POSTGRES_POOL_SIZE: ${WORKER_LANGGRAPH_POSTGRES_POOL_SIZE:-120}
      LANGGRAPH_POSTGRES_POOL_TIMEOUT_SECONDS: ${WORKER_LANGGRAPH_POSTGRES_POOL_TIMEOUT_SECONDS:-30}
    command: uv run --no-sync --no-dev python -m seek.workers.main
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -m
      - seek.workers.health
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 180s
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      app-init:
        condition: service_completed_successfully
      sandbox-runner:
        condition: service_healthy
    logging:
      driver: json-file
      options: *id001
  app-init:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-seek}-api:${SEEK_VERSION:-0.8.0.beta4}
    working_dir: /app
    volumes:
    - ${SEEK_STATE_DIR:-./docker/volumes}/seek/skill-sources:/app/skill-sources
    - ./backend/seek:/app/seek:ro
    networks:
    - app-network
    env_file:
    - ${SEEK_ENV_FILE:-.env}
    environment:
      HOST_IP: ${HOST_IP:-}
      RUNNING_IN_DOCKER: 'true'
      SEEK_ENV: development
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env, or rerun `bash
        scripts/init.sh`.}
      SEEK_INSTANCE_ID: ${SEEK_INSTANCE_ID:?Set SEEK_INSTANCE_ID in .env, or rerun
        `bash scripts/init.sh`.}
      API_KEY_DERIVATION_SECRET: ${API_KEY_DERIVATION_SECRET:?Set API_KEY_DERIVATION_SECRET
        in .env [v0.7.2+], or rerun `bash scripts/init.sh`.}
      RAPIDOCR_MODEL_DIR: /home/seek/.cache/rapidocr/models
      POSTGRES_URL: ${POSTGRES_URL:-postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-seek}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MINIO_URI: ${MINIO_URI:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINERU_API_URI: ${MINERU_API_URI:-http://mineru-api:30001}
      PADDLEX_URI: ${PADDLEX_URI:-http://paddlex:8080}
      SANDBOX_RUNNER_URL: ${SANDBOX_RUNNER_URL:-http://sandbox-runner:8090}
      SANDBOX_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN:-}
      SANDBOX_IDLE_SECONDS: ${SANDBOX_IDLE_SECONDS:-300}
      SANDBOX_EXEC_TIMEOUT_SECONDS: ${SANDBOX_EXEC_TIMEOUT_SECONDS:-180}
      SANDBOX_MAX_OUTPUT_BYTES: ${SANDBOX_MAX_OUTPUT_BYTES:-262144}
      RUN_CANCEL_KEY_TTL_SECONDS: ${RUN_CANCEL_KEY_TTL_SECONDS:-1800}
      RUN_EVENTS_STREAM_TTL_SECONDS: ${RUN_EVENTS_STREAM_TTL_SECONDS:-7200}
      READINESS_PROBE_TIMEOUT_SECONDS: ${READINESS_PROBE_TIMEOUT_SECONDS:-2}
      READINESS_CACHE_TTL_SECONDS: ${READINESS_CACHE_TTL_SECONDS:-1}
      SEEK_CORS_ORIGINS: ${SEEK_CORS_ORIGINS:-}
      SEEK_SKILL_DATA_DIR: /app/skill-sources
      SEEK_SKILL_PROJECTION_DIR: /app/skill-projections
      NO_PROXY: localhost,127.0.0.1,postgres,redis,minio,sandbox-runner
      no_proxy: localhost,127.0.0.1,postgres,redis,minio,sandbox-runner
    command: uv run --no-sync --no-dev python -m seek.bootstrap.app
    restart: 'no'
    depends_on:
      storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options: *id001
  sandbox-image:
    build:
      context: .
      dockerfile: docker/sandbox.Dockerfile
    image: ${SANDBOX_CONTAINER_IMAGE:-seek-sandbox:${SEEK_VERSION:-0.8.0.beta4}}
    command:
    - 'true'
    network_mode: none
    restart: 'no'
    logging:
      driver: json-file
      options: *id001
  sandbox-runner:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-seek}-api:${SEEK_VERSION:-0.8.0.beta4}
    working_dir: /app
    user: 0:0
    volumes:
    - ./backend/seek:/app/seek
    - /var/run/docker.sock:/var/run/docker.sock
    - type: bind
      source: ${SEEK_STATE_DIR:-./docker/volumes}/seek/threads
      target: /sandbox-data
    - type: bind
      source: ${SEEK_STATE_DIR:-./docker/volumes}/seek/skill-projections
      target: /sandbox-skill-projections
      read_only: true
    networks:
    - app-network
    environment:
      POSTGRES_URL: ${POSTGRES_URL:-postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-seek}}
      SEEK_ENV: ${SEEK_ENV:-development}
      SANDBOX_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN:-}
      SANDBOX_CONTAINER_SOCKET: /var/run/docker.sock
      SANDBOX_CONTAINER_IMAGE: ${SANDBOX_CONTAINER_IMAGE:-seek-sandbox:${SEEK_VERSION:-0.8.0.beta4}}
      SANDBOX_CONTAINER_IMAGE_DIGEST: ${SANDBOX_CONTAINER_IMAGE_DIGEST:-}
      SANDBOX_CONTAINER_NETWORK: ${SANDBOX_CONTAINER_NETWORK:-none}
      SANDBOX_CONTAINER_MEMORY_BYTES: ${SANDBOX_CONTAINER_MEMORY_BYTES:-1073741824}
      SANDBOX_CONTAINER_CPUS: ${SANDBOX_CONTAINER_CPUS:-1}
      SANDBOX_CONTAINER_PIDS_LIMIT: ${SANDBOX_CONTAINER_PIDS_LIMIT:-256}
      SANDBOX_CONTAINER_HOME_BYTES: ${SANDBOX_CONTAINER_HOME_BYTES:-268435456}
      SANDBOX_CONTAINER_TMP_BYTES: ${SANDBOX_CONTAINER_TMP_BYTES:-268435456}
      SANDBOX_CONTAINER_MAX_CONTAINERS: ${SANDBOX_CONTAINER_MAX_CONTAINERS:-32}
      SANDBOX_CONTAINER_MAX_EXECS: ${SANDBOX_CONTAINER_MAX_EXECS:-8}
      SANDBOX_CONTAINER_MAX_LIFETIME_SECONDS: ${SANDBOX_CONTAINER_MAX_LIFETIME_SECONDS:-7200}
      SANDBOX_CONTAINER_UID: ${SANDBOX_CONTAINER_UID:-1000}
      SANDBOX_CONTAINER_GID: ${SANDBOX_CONTAINER_GID:-1000}
      NO_PROXY: localhost,127.0.0.1
      no_proxy: localhost,127.0.0.1
    command: uv run --no-sync --no-dev uvicorn seek.sandbox_runner.main:app --host
      0.0.0.0 --port 8090 --no-access-log
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://localhost:8090/healthz || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      app-init:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options: *id001
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: development
    image: ${COMPOSE_PROJECT_NAME:-seek}-frontend:${SEEK_VERSION:-0.8.0.beta4}
    volumes:
    - ./frontend/src:/app/src
    - ./frontend/public:/app/public
    - ./frontend/index.html:/app/index.html
    - ./frontend/vite.config.js:/app/vite.config.js
    ports:
    - ${SEEK_FRONTEND_PORT:-35173}:5173
    depends_on:
    - api
    networks:
    - app-network
    environment:
    - NODE_ENV=development
    - VITE_API_URL=http://api:5050
    command: pnpm run server
    restart: unless-stopped
    logging:
      driver: json-file
      options: *id001
  minio:
    build:
      context: ./docker/minio
      dockerfile: Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-seek}-minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
    - type: bind
      source: ${SEEK_STATE_DIR:-./docker/volumes}/minio
      target: /data
    - type: bind
      source: ${SEEK_STATE_DIR:-./docker/volumes}/minio_config
      target: /root/.minio
    command: minio server /data --address 0.0.0.0:9000 --console-address 0.0.0.0:9001
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 30s
    ports:
    - 127.0.0.1:${SEEK_MINIO_API_PORT:-39000}:9000
    - 127.0.0.1:${SEEK_MINIO_CONSOLE_PORT:-39001}:9001
    networks:
    - app-network
    restart: unless-stopped
    logging:
      driver: json-file
      options: *id001
  storage-init:
    build:
      context: .
      dockerfile: docker/storage-init.Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-seek}-storage-init:${SEEK_VERSION:-0.8.0.beta4}
    network_mode: none
    user: 0:0
    volumes:
    - ${SEEK_STATE_DIR:-./docker/volumes}/seek/threads:/app/user-data
    - ${SEEK_STATE_DIR:-./docker/volumes}/seek/skill-sources:/app/skill-sources
    - ${SEEK_STATE_DIR:-./docker/volumes}/seek/skill-projections:/app/skill-projections
    restart: 'no'
    logging:
      driver: json-file
      options: *id001
  postgres:
    image: postgres:16
    command:
    - postgres
    - -c
    - max_connections=${POSTGRES_MAX_CONNECTIONS:-600}
    ports:
    - 127.0.0.1:${SEEK_POSTGRES_PORT:-35432}:5432
    environment:
    - POSTGRES_USER=${POSTGRES_USER:-postgres}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    - POSTGRES_DB=${POSTGRES_DB:-seek}
    - TZ=${TZ:-Asia/Shanghai}
    volumes:
    - type: bind
      source: ${SEEK_STATE_DIR:-./docker/volumes}/postgresql
      target: /var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-seek} || exit 1
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
    - app-network
    restart: unless-stopped
    logging:
      driver: json-file
      options: *id001
  redis:
    image: redis:7.4.10-alpine
    ports:
    - 127.0.0.1:${SEEK_REDIS_PORT:-36379}:6379
    command: redis-server --appendonly yes
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
    - type: bind
      source: ${SEEK_STATE_DIR:-./docker/volumes}/redis
      target: /data
    networks:
    - app-network
    restart: unless-stopped
    logging:
      driver: json-file
      options: *id001
networks:
  app-network:
    driver: bridge
